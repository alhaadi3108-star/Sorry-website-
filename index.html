<!DOCTYPE html>
<html>
<head>
<title>Please Forgive Me ❤️</title>

<style>
body{
    background: linear-gradient(135deg,#ffd6e7,#fff0f5);
    text-align:center;
    font-family:Arial,sans-serif;
    overflow:hidden;
    height:100vh;
}

h1{
    margin-top:80px;
    color:#ff4081;
    font-size:45px;
}

p{
    font-size:22px;
    color:#555;
}

button{
    padding:15px 30px;
    font-size:20px;
    border:none;
    border-radius:30px;
    cursor:pointer;
}

#yesBtn{
    background:#ff4081;
    color:white;
    margin-right:20px;
}

#noBtn{
    background:#999;
    color:white;
    position:absolute;
}
</style>
</head>

<body>

<h1>🥺 I'm Really Sorry ❤️</h1>

<p>
You mean a lot to me 💖<br>
Please forgive me? 🌸
</p>

<button id="yesBtn" onclick="forgive()">
💖 Yes
</button>

<button id="noBtn">
😒 No
</button>

<script>
function forgive(){
    document.body.innerHTML = `
    <div style="margin-top:120px;">
        <h1 style="color:#ff4081;">Yayyy! ❤️🥹</h1>
        <h2>Thank You For Forgiving Me 💕</h2>
        <p>You are the sweetest person ever 🌸</p>
    </div>
    `;
}

const noBtn = document.getElementById("noBtn");

function moveButton(){
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 80);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("touchstart", moveButton);

moveButton();
</script>

</body>
</html>
